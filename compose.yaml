name: lg-production-dashboard

x-app: &app
  image: lg-production-dashboard-app:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file:
    - .env
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  networks:
    - web
    - planta_a
    - planta_b
  depends_on:
    mysql_planta_a:
      condition: service_healthy
    mysql_planta_b:
      condition: service_healthy

services:
  app:
    <<: *app
    command:
      - /bin/sh
      - -c
      - |
        chmod -R a+rwX storage bootstrap/cache
        exec php-fpm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    depends_on:
      - app

  simulator:
    <<: *app
    # Erros reais permitem até três reinícios; conclusão do dia termina com sucesso.
    restart: "on-failure:3"
    command:
      - /bin/sh
      - -c
      - |
        while [ "$${SIMULATION_ENABLED:-true}" = "true" ]; do
          php artisan production:simulate
          codigo_saida=$$?

          if [ "$$codigo_saida" -eq 2 ]; then
            echo "Dia simulado concluído; encerrando o serviço."
            exit 0
          fi

          if [ "$$codigo_saida" -ne 0 ]; then
            exit "$$codigo_saida"
          fi

          sleep "$${SIMULATION_INTERVAL_SECONDS:-10}"
        done

  mysql_planta_a:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_PLANTA_A_DATABASE:-planta_a}
      MYSQL_USER: ${DB_PLANTA_A_USERNAME:-lg_app}
      MYSQL_PASSWORD: ${DB_PLANTA_A_PASSWORD:-lg_app_secret_a}
      MYSQL_ROOT_PASSWORD: ${DB_PLANTA_A_ROOT_PASSWORD:-root_secret_a}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PLANTA_A_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mysql_planta_a_data:/var/lib/mysql
    networks:
      - planta_a
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql_planta_b:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_PLANTA_B_DATABASE:-planta_b}
      MYSQL_USER: ${DB_PLANTA_B_USERNAME:-lg_app}
      MYSQL_PASSWORD: ${DB_PLANTA_B_PASSWORD:-lg_app_secret_b}
      MYSQL_ROOT_PASSWORD: ${DB_PLANTA_B_ROOT_PASSWORD:-root_secret_b}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PLANTA_B_EXPOSED_PORT:-3308}:3306"
    volumes:
      - mysql_planta_b_data:/var/lib/mysql
    networks:
      - planta_b
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  web:
  planta_a:
    internal: true
  planta_b:
    internal: true

volumes:
  mysql_planta_a_data:
  mysql_planta_b_data:
